name: Storage hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/storage-hygiene.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: storage-hygiene
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Purge stale Actions artifacts and caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CACHE_MAX_AGE_DAYS: '7'
        shell: bash
        run: |
          set -euo pipefail

          now="$(date -u +%s)"
          deleted_artifacts=0
          deleted_artifact_bytes=0

          while IFS=$'\t' read -r id name created_at run_id size_bytes; do
            [[ -n "${id:-}" ]] || continue

            case "$name" in
              g-pc-health-check-sbom) keep_days=90 ;;
              g-pc-health-check-windows-x64|g-pc-health-check-pilot-e2e) keep_days=14 ;;
              development-check-summary) keep_days=7 ;;
              *) keep_days=7 ;;
            esac

            created_epoch="$(date -u -d "$created_at" +%s)"
            age_seconds=$(( now - created_epoch ))
            if (( age_seconds >= keep_days * 86400 )); then
              echo "delete artifact id=$id name=$name run_id=$run_id age_days=$(( age_seconds / 86400 )) size=$size_bytes"
              gh api -X DELETE "/repos/$REPO/actions/artifacts/$id"
              deleted_artifacts=$(( deleted_artifacts + 1 ))
              deleted_artifact_bytes=$(( deleted_artifact_bytes + size_bytes ))
            fi
          done < <(
            gh api --paginate "/repos/$REPO/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id,.name,.created_at,(.workflow_run.id // 0),.size_in_bytes] | @tsv'
          )

          deleted_caches=0
          while IFS=$'\t' read -r cache_id key ref last_accessed_at size_bytes; do
            [[ -n "${cache_id:-}" ]] || continue
            accessed_epoch="$(date -u -d "$last_accessed_at" +%s)"
            age_seconds=$(( now - accessed_epoch ))
            if (( age_seconds >= CACHE_MAX_AGE_DAYS * 86400 )); then
              echo "delete cache id=$cache_id ref=$ref age_days=$(( age_seconds / 86400 )) size=$size_bytes key=$key"
              gh api -X DELETE "/repos/$REPO/actions/caches/$cache_id"
              deleted_caches=$(( deleted_caches + 1 ))
            fi
          done < <(
            gh api --paginate "/repos/$REPO/actions/caches?per_page=100" \
              --jq '.actions_caches[] | [.id,.key,.ref,.last_accessed_at,.size_in_bytes] | @tsv'
          )

          echo "storage-hygiene deleted_artifacts=$deleted_artifacts deleted_artifact_bytes=$deleted_artifact_bytes deleted_caches=$deleted_caches"

name: Adopt CDC 2.8.2
on:
  push:
    branches: ["cdc/adopt-2.8.2"]
    paths: [".github/workflows/cdc-adopt-2.8.2.yml"]

permissions:
  contents: write

jobs:
  adopt:
    runs-on: ubuntu-latest
    env:
      BASE_REF: "design/0.17.0-security-posture"
      CDC_VERSION: "2.8.2"
      CDC_RELEASE_REF: "refs/heads/release/v2.8.2"
      CDC_RELEASE_COMMIT: "d926f98f01017e9c007a6cbb66023f729516eb9a"
      CDC_PACKAGE_TREE: "bdf18b8dedb2f0cf62728935d92e6260b4a64ef0"
      CARRIER_SHA: "db9b91088f7b92c2d35e887c744fcbf48c6b95c3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch immutable CDC carrier
        run: |
          mkdir -p /tmp/cdc-carrier
          curl -fsSL "https://codeload.github.com/bajoicheg/g-switcher/tar.gz/${CARRIER_SHA}" |
            tar -xz -C /tmp/cdc-carrier --strip-components=1
          test "$(cat /tmp/cdc-carrier/.agents/skills/continuous-development-cycle/VERSION)" = "2.8.2"
      - name: Install policy parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Adopt, bind and validate
        env:
          REPO_NAME: ${{ github.repository }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          python - <<'PY'
          import copy, datetime, json, os, pathlib, re, shutil, sys, yaml

          root=pathlib.Path.cwd()
          repo=os.environ["REPO_NAME"]
          base_ref=os.environ["BASE_REF"]
          private=os.environ["REPO_PRIVATE"].lower()=="true"
          version=os.environ["CDC_VERSION"]
          release_ref=os.environ["CDC_RELEASE_REF"]
          release_commit=os.environ["CDC_RELEASE_COMMIT"]
          package_tree=os.environ["CDC_PACKAGE_TREE"]
          src=pathlib.Path("/tmp/cdc-carrier/.agents/skills/continuous-development-cycle")
          dst=root/".agents/skills/continuous-development-cycle"
          docs=root/"docs"; docs.mkdir(parents=True,exist_ok=True)

          old_lock_path=docs/"cdc-consumer-lock.json"
          old_lock=json.loads(old_lock_path.read_text(encoding="utf-8")) if old_lock_path.exists() else None

          if dst.exists(): shutil.rmtree(dst)
          dst.parent.mkdir(parents=True,exist_ok=True)
          shutil.copytree(src,dst,copy_function=shutil.copy2)

          lock={"schema":"cdc-consumer-lock/v1","canonical_repository":"bajoicheg/g-cdc",
                "version":version,"release_ref":release_ref,"release_commit":release_commit,
                "package_tree":package_tree,"checkpoint_schema":"development-work-status/v4",
                "safe_boundary_required":True,"local_core_modifications_allowed":False}
          old_lock_path.write_text(json.dumps(lock,indent=2)+"\n",encoding="utf-8")

          canon=yaml.safe_load((src/"templates/development-cycle.yaml").read_text(encoding="utf-8"))
          adapter_path=docs/"development-cycle.yaml"
          adapter=yaml.safe_load(adapter_path.read_text(encoding="utf-8")) if adapter_path.exists() else copy.deepcopy(canon)
          adapter["repository"]["name"]=adapter["repository"].get("name") or repo.split("/",1)[1]
          adapter["repository"]["remote"]=repo
          adapter["policy"]["revision"]="2026-09-26-cdc-2.8.2-fleet-adoption"
          adapter["policy"]["skill_min_version"]=version
          adapter["policy"]["skill_max_version_exclusive"]="3.0.0"
          adapter["checkpoint"]["path"]="docs/work-status/current.md"
          adapter["checkpoint"]["schema"]="development-work-status/v4"
          for section in ("routing","recovery_recipes","continuation","fleet","convergence","progress_slo","audit","autonomy","publication","hardening","maturity"):
              if section not in adapter: adapter[section]=copy.deepcopy(canon[section])
          for key in ("cost_policy_ref","cost_router_authority","github_actions_requires_reason","transient_primary_failure_policy"):
              adapter["routing"].setdefault(key,copy.deepcopy(canon["routing"][key]))
          adapter["routing"]["repository_visibility"]="private" if private else "public"
          adapter["convergence"]["target_version"]=version
          adapter["autonomy"]=copy.deepcopy(canon["autonomy"])
          adapter["publication"]=copy.deepcopy(canon["publication"])
          adapter["hardening"]=copy.deepcopy(canon["hardening"])
          adapter["maturity"]=copy.deepcopy(canon["maturity"])
          adapter_path.write_text(yaml.safe_dump(adapter,sort_keys=False,allow_unicode=True),encoding="utf-8")

          sys.path.insert(0,str(dst/"scripts"))
          from validate_adapter import validate_adapter
          binding=validate_adapter(adapter,version)

          cp_path=docs/"work-status/current.md"
          text=cp_path.read_text(encoding="utf-8") if cp_path.exists() else (src/"templates/work-status-v4.md").read_text(encoding="utf-8")
          m=re.match(r"\A---\n(.*?)\n---(?:\n|\Z)(.*)\Z",text,re.S)
          if not m: raise SystemExit("checkpoint frontmatter missing")
          cp=yaml.safe_load(m.group(1)); body=m.group(2)
          cp["repository"]=repo; cp["branch"]=base_ref
          cp["policy_revision"]=binding["policy_revision"]; cp["policy_digest"]=binding["policy_digest"]
          cp["observed_at_utc"]=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          cp["lease_state"]="released"; cp["active_executor"]="none"
          cp["executor_heartbeat_at_utc"]=None; cp["execution_lease_until_utc"]=None
          if "control" in cp: cp["control"]["executor_id"]=None
          ec=cp.setdefault("execution_continuity",{})
          ec["invocation_id"]=None; ec["primitive_steps_since_progress"]=0
          ec["meaningful_progress"]=True; ec["last_progress_ref"]="cdc-adoption:2.8.2"
          external=cp.get("lease_state")=="waiting_external" or cp.get("phase")=="waiting_external"
          blocker=str(cp.get("blocker","")).strip().lower() not in {"","none","no blocker","n/a","-"}
          if cp.get("phase")=="complete":
              ec["runnable_next_action"]=False; ec["completion_gate"]="task_complete"
          elif external:
              ec["runnable_next_action"]=False; ec["completion_gate"]="durable_external_binding"
          elif blocker:
              ec["runnable_next_action"]=bool(cp.get("next_action")); ec["completion_gate"]="resumable_blocker"
          else:
              ec["runnable_next_action"]=bool(cp.get("next_action")); ec["completion_gate"]="meaningful_progress"
          cp_path.parent.mkdir(parents=True,exist_ok=True)
          cp_path.write_text("---\n"+yaml.safe_dump(cp,sort_keys=False,allow_unicode=True).rstrip()+"\n---\n"+body.lstrip("\n"),encoding="utf-8")

          provenance=(
            "## CDC 2.8.2 authoritative provenance\n\n"
            "Current CDC authority is canonical `bajoicheg/g-cdc` **v2.8.2**, immutable "
            "`refs/heads/release/v2.8.2`, release commit `d926f98f01017e9c007a6cbb66023f729516eb9a`, "
            "package tree `bdf18b8dedb2f0cf62728935d92e6260b4a64ef0`. The complete package is vendored at "
            "`.agents/skills/continuous-development-cycle/`; lower-version CDC statements below are historical.\n\n"
            "Terminal-State v2, No-Idle, operational hardening, fleet maturity and sanitized-publication controls are mandatory.\n\n")
          agents=root/"AGENTS.md"
          if agents.exists():
              old=agents.read_text(encoding="utf-8")
              old=re.sub(r"## CDC 2\.8\.2 authoritative provenance\n.*?(?=\n## |\Z)","",old,flags=re.S)
              agents.write_text(provenance+old.lstrip(),encoding="utf-8")
          else:
              agents.write_text("# "+repo.split("/",1)[1]+"\n\n"+provenance+(src/"templates/AGENTS.snippet.md").read_text(encoding="utf-8"),encoding="utf-8")

          if old_lock:
              for wf in list((root/".github/workflows").glob("*.yml"))+list((root/".github/workflows").glob("*.yaml")) if (root/".github/workflows").exists() else []:
                  t=wf.read_text(encoding="utf-8")
                  if "continuous-development-cycle" not in t and old_lock["package_tree"] not in t: continue
                  for old,new in ((old_lock["version"],version),(old_lock["release_ref"],release_ref),
                                  (old_lock["release_commit"],release_commit),(old_lock["package_tree"],package_tree)):
                      t=t.replace(old,new)
                  wf.write_text(t,encoding="utf-8")
          PY

          python -B .agents/skills/continuous-development-cycle/scripts/validate_package.py
          python -B .agents/skills/continuous-development-cycle/scripts/validate_adapter.py docs/development-cycle.yaml --json
          python -B .agents/skills/continuous-development-cycle/scripts/consumer_lock.py docs/cdc-consumer-lock.json
          python -B .agents/skills/continuous-development-cycle/scripts/validate_checkpoint_24.py docs/work-status/current.md --adapter docs/development-cycle.yaml
          rm -f .github/workflows/cdc-adopt-2.8.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x .agents/skills/continuous-development-cycle/scripts/{capability_router.py,continuation_queue.py,control_plane_audit.py,execution_continuity.py,execution_lease.py,fleet_supervisor.py,operation_intent.py,progress_slo.py,recovery.py,recovery_recipes.py,resume_capsule.py,run_checks.py,validate_checkpoint.py,validate_checkpoint_24.py,validate_evidence.py,version_convergence.py,watchdog_health.py}
          git add -A
          git add -f .agents/skills/continuous-development-cycle
          TREE="$(git write-tree)"
          ACTUAL="$(git rev-parse "${TREE}:.agents/skills/continuous-development-cycle")"
          echo "CDC_SUBTREE=${ACTUAL}"
          test "${ACTUAL}" = "${CDC_PACKAGE_TREE}"
          git commit -m "chore(cdc): adopt canonical CDC 2.8.2 [skip ci]"
          git push origin HEAD:cdc/adopt-2.8.2
          test -z "$(git status --porcelain)"
